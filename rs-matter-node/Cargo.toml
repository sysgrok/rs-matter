[package]
name = "rs-matter-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Native Rust implementation of the Matter (Smart-Home) ecosystem - the node: transport, secure channel, fabrics"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["os", "log"]

# Sizing

# Number of fabrics.
max-fabrics-32 = []
max-fabrics-16 = []
max-fabrics-8 = []
max-fabrics-7 = []
max-fabrics-6 = []
# Default number of fabrics (Matter requires a minimum of 5 fabrics).
max-fabrics-5 = []
max-fabrics-4 = []
max-fabrics-3 = []
max-fabrics-2 = []
max-fabrics-1 = []

# Number of groups per fabrics.
max-groups-per-fabric-32 = []
max-groups-per-fabric-16 = []
max-groups-per-fabric-12 = []
max-groups-per-fabric-8 = []
max-groups-per-fabric-7 = []
max-groups-per-fabric-6 = []
max-groups-per-fabric-5 = []
# Default number of groups per fabric (Matter requires a minimum of 4 group table entries per fabric).
max-groups-per-fabric-4 = []

# Number of group keys per fabric.
max-group-keys-per-fabric-5 = []
max-group-keys-per-fabric-4 = []
# Default number of group keys per fabric (Matter requires a minimum of 1 group keys per fabric).
max-group-keys-per-fabric-3 = []
max-group-keys-per-fabric-2 = []

# Number of endpoints that can be members of a group (per fabric).
max-group-endpoints-per-fabric-5 = []
max-group-endpoints-per-fabric-4 = []
# Default number of endpoints that can be members of a group (per fabric).
max-group-endpoints-per-fabric-3 = []
max-group-endpoints-per-fabric-2 = []
max-group-endpoints-per-fabric-1 = []

# Number of ACL entries per fabric.
max-acls-per-fabric-32 = []
max-acls-per-fabric-16 = []
max-acls-per-fabric-8 = []
max-acls-per-fabric-7 = []
max-acls-per-fabric-6 = []
max-acls-per-fabric-5 = []
# Default number of ACL entries per fabric (Matter requires a minimum of 3 ACL entries per fabric).
max-acls-per-fabric-4 = []
max-acls-per-fabric-3 = []
max-acls-per-fabric-2 = []
max-acls-per-fabric-1 = []

# Number of subjects per ACL entry.
max-subjects-per-acl-32 = []
max-subjects-per-acl-16 = []
max-subjects-per-acl-8 = []
max-subjects-per-acl-7 = []
max-subjects-per-acl-6 = []
max-subjects-per-acl-5 = []
# Default number of subjects per ACL entry (Matter requires a minimum of 4 subjects per ACL entry).
max-subjects-per-acl-4 = []
max-subjects-per-acl-3 = []
max-subjects-per-acl-2 = []
max-subjects-per-acl-1 = []

# Number of targets per ACL entry.
max-targets-per-acl-32 = []
max-targets-per-acl-16 = []
max-targets-per-acl-8 = []
max-targets-per-acl-7 = []
max-targets-per-acl-6 = []
max-targets-per-acl-5 = []
max-targets-per-acl-4 = []
# Default number of targets per ACL entry (Matter requires a minimum of 3 targets per ACL entry).
max-targets-per-acl-3 = []
max-targets-per-acl-2 = []
max-targets-per-acl-1 = []

# Number of sessions.
max-sessions-64 = []
max-sessions-32 = []
# Default number of sessions (Matter requires a minimum of 3 sessions per fabric).
max-sessions-16 = []
max-sessions-8 = []
max-sessions-7 = []
max-sessions-6 = []
max-sessions-5 = []
max-sessions-4 = []
max-sessions-3 = []

# Number of exchanges per session.
max-exchanges-per-session-16 = []
max-exchanges-per-session-8 = []
max-exchanges-per-session-7 = []
max-exchanges-per-session-6 = []
# Default number of exchanges per session (Matter requires a minimum of 5 exchanges per session).
max-exchanges-per-session-5 = []
max-exchanges-per-session-4 = []
max-exchanges-per-session-3 = []

# Number of BTP sessions.
max-btp-sessions-8 = []
max-btp-sessions-4 = []
max-btp-sessions-2 = []
# Default number of BTP sessions (Matter accessories typically need just 1 BTP session).
max-btp-sessions-1 = []

# Number of candidate peer addresses kept per mDNS resolve, for CASE failover.
max-resolve-candidates-8 = []
max-resolve-candidates-6 = []
max-resolve-candidates-5 = []
# Default number of resolve candidates: enough to hold the largest address set a
# conformant peer can advertise on Wi-Fi / Ethernet - its link-local address plus
# the three routable ones the Matter Core Specification requires it to support.
max-resolve-candidates-4 = []
max-resolve-candidates-3 = []
max-resolve-candidates-2 = []
# No failover: only the best-scored address is ever tried.
max-resolve-candidates-1 = []

# General

# mDNS support for MacOSX.
astro-dnssd = ["os", "dep:astro-dnssd"]
# mDNS support for Linux and Windows (via Avahi or Bonjour).
# Prefer the Avahi and Resolved mDNS implementations over Zeroconf for production deployments, via `zbus`.
zeroconf = ["os", "dep:zeroconf"]
# Enable the zBus proxies for a range of Linux dBus services used by `rs-matter` (off by default due to slow compilation).
zbus = ["dep:zbus", "dep:serde", "os", "futures-lite", "libc", "uuid", "async-channel", "rs-matter-utils/zbus"]
# BLE suppport for Linux (via BlueZ).
# Prefer the BlueZ implementation over Bluer for production deployments, via `zbus`.
bluer = ["dep:bluer", "dep:tokio", "dep:tokio-stream", "os", "rs-matter-utils/bluer"]
# Umbrella set of features for typical OS-based non-baremetal deployments.
os = ["std", "async-io", "rs-matter-utils/backtrace", "rs-matter-utils/os"]
std = ["alloc", "rs-matter-utils/std", "rs-matter-tlv/std", "rs-matter-crypto/std", "rs-matter-cert/std", "rs-matter-pairing/std", "rs-matter-im-base/std", "rs-matter-dm-base/std"]
alloc = ["defmt?/alloc", "rs-matter-utils/alloc", "rs-matter-tlv/alloc", "rs-matter-crypto/alloc", "rs-matter-cert/alloc", "rs-matter-pairing/alloc", "rs-matter-im-base/alloc", "rs-matter-dm-base/alloc"]
# Multicast groups support.
groups = ["rs-matter-crypto/groups"]
# Extends the transport and the IM buffers to 1MB (from 1500 B), for Matter over TCP.
large-buffers = ["rs-matter-dm-base/large-buffers"]
# CASE session resumption (Sigma2-Resume fast-path + its persisted cache).
case-resumption = []
# Never initiate a new CASE session: `Exchange::initiate` only reuses an existing session (else fails).
case-responder-only = []
# Enable `debug`-level logging of TLV payloads.
log-tlv-payload = []
# Promote MRP-diagnostic logs from `debug` to `warn`.
log-mrp = []
# Emit the data model as JSON (`Matter::write_pics_json`), for deriving a PICS
# declaration from what the device actually implements rather than by hand.
pics = []
defmt = ["dep:defmt", "rs-matter-utils/defmt", "rs-matter-tlv/defmt", "rs-matter-crypto/defmt", "rs-matter-cert/defmt", "rs-matter-pairing/defmt", "rs-matter-im-base/defmt", "rs-matter-dm-base/defmt"]
log = ["dep:log", "rs-matter-utils/log", "rs-matter-tlv/log", "rs-matter-crypto/log", "rs-matter-cert/log", "rs-matter-pairing/log", "rs-matter-im-base/log", "rs-matter-dm-base/log"]

[dependencies]
rs-matter-utils = { workspace = true }
rs-matter-tlv = { workspace = true }
rs-matter-crypto = { workspace = true }
rs-matter-cert = { workspace = true }
rs-matter-pairing = { workspace = true }
rs-matter-im-base = { workspace = true }
rs-matter-dm-base = { workspace = true }
bitflags = { workspace = true }
cfg-if = { workspace = true }
domain = { workspace = true }
either = { workspace = true }
num = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
rand_core = { workspace = true }
subtle = { workspace = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

# STD
async-io = { workspace = true, optional = true }

# OS
zbus = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
async-channel = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
libc = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
astro-dnssd = { workspace = true, optional = true }
zeroconf = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "espidf")))'.dependencies]
nix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }
tokio-stream = { workspace = true, optional = true }

[dev-dependencies]
rs-matter-crypto = { workspace = true, features = ["rustcrypto"] }
# For the Identify cluster metadata in the test of `pics`
rs-matter-dm-clusters = { workspace = true }
embassy-time-queue-utils = { workspace = true, features = ["generic-queue-64"] }
env_logger = { workspace = true }
futures-lite = { workspace = true }

[lints.rust]
# `cargo llvm-cov` sets these when measuring coverage (the second one only on nightly)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
